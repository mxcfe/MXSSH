[project]
name = "mxssh"
version = "0.1.0"
description = "Browser-based SSH terminal"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.18,<3",
    "fastapi>=0.115,<1",
    "pillow>=10,<13; sys_platform == 'win32'",
    "pystray>=0.19.5,<1; sys_platform == 'win32'",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
build = ["pyinstaller>=6.20,<7; sys_platform == 'win32'"]
